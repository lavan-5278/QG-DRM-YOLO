[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultralytics-dsr"
version = "0.1.0"
description = "DSR-Det: Differential Social Relation Detection as an Ultralytics-native extension (Phase 0/1 skeleton)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics==8.3.247",
  "torch>=2.0",
  "torchvision>=0.15",
  "opencv-python>=4.8",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "pytest>=7.0",
]

[tool.pytest.ini_options]
markers = [
  "slow: integration/smoke tests that run model.train()/model.val() on tiny data",
]
addopts = "-m 'not slow'"
testpaths = ["tests"]

[tool.setuptools]
# The vendored `ultralytics` tree is imported from the project root at runtime;
# it is not pip-installed, so no packages are declared here.
