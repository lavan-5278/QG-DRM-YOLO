# DSR-Det v2 (Selective Differential Social Refinement) - Ultralytics native extension
# Base: YOLO11 (P3/8 - P5/32), Detect head replaced by DSRDetect (MDRR + refinement).
# File name selects the scale: yolo11n-dsr.yaml -> 'n', yolo11s-dsr.yaml -> 's'.

# Parameters
nc: 3 # SCB-Dataset3-S: hand_raising, reading, writing
scales: # model compound scaling constants [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]

# DSR-Det v2 configuration (consumed by DSRDetect / DSRDetectionLoss)
# v2: only ambiguous candidates enter the KNN relation branch, classification-only
# residual (bbox stays with YOLO), reliable-neighbor weighting, preservation loss.
dsr:
  enabled: true
  relation_dim: 128
  roi_size: 3
  pre_topk: 300
  relation_topk: 100
  candidate_conf: 0.03
  candidate_iou: 0.70
  min_candidates: 2 # fewer candidates cannot form an inter-object relation
  neighbor_k: 5
  use_composition: true # v3: composition prior (conf-weighted group prototype + soft class histogram), selected candidates only
  composition_proto: conf # conf | uniform
  uncertainty_type: margin # v2: u = 1 - (p_top1 - p_top2); max_prob | margin | entropy
  uncertainty_threshold: 0.5 # v2: only ambiguous candidates (top1-top2 < 0.5) enter the relation branch
  preserve_threshold: 0.9 # v2: candidates with conf > threshold are anchored by KL
  neighbor_reliability: true # v2: alpha_ij = softmax(s_ij + log(1 - u_j + eps))
  gate_mode: uncertainty # fixed | scalar | conf | feature | uncertainty (v1.1 18.5; ignored when use_uncertainty_gate: true)
  track_uncertainty: true # u-distribution audit -> runs/<exp>/uncertainty_audit.json
  relation_type: signed_diff # R0-R7: none|dot|concat|product|abs_diff|edgeconv|signed_diff|transformer
  relation_variant: none # M1-M5: none|no_geo|no_gate|flip|shared (applies to signed_diff)
  include_geometry: true # geometric edge encoding (dx/dy/log-size/IoU)
  candidate_source: current # current | ema (stable-candidate control, v1.1 14.1)
  ema_decay: 0.999
  track_stability: true # candidate-set stability probe vs stability_ref_epoch
  stability_ref_epoch: 0
  stability_every: 5
  stability_probe_batches: 1
  stage_b1_epochs: 20 # Stage B1: train MDRR + refine head only (v1.1 14.1)
  stage_b1_freeze: [backbone, neck, base_detect]
  stage_b2_freeze: [backbone, neck, base_detect] # v3: base detector frozen for the whole Stage B
  stage_b2_lr_scale: 0.1 # 1/10-1/20 of Stage A/B1 LR
  lambda_relation: 1.0 # v2: L_relation (BCE on ambiguous candidates)
  lambda_preserve: 0.5 # v2: L_preserve (KL on high-confidence candidates)
  use_gicr: true # v3: geometry-aware intra-frame contrastive regularization (joint B2)
  lambda_gicr: 0.05
  lambda_gicr_diff: 0.5
  gicr_warmup_epochs: 5 # GICR weight 0 for the first N epochs of Stage B
  gicr_m_s: 0.3
  gicr_m_d: 0.8
  gicr_tau_g: 2.0
  use_global: false # v2: global/region relations removed (majority-class bias)
  use_region: false
  use_neighbor: true
  use_uncertainty_gate: true # true -> uncertainty-aware gate; false -> use gate_mode
  validator: false # true -> DSRDetectionValidator (strata/recall/oracle in model.val())
  oracle: true # oracle-candidate upper-bound analysis (v1.1 19.5)
  scenario_conf_sweep: [0.01, 0.03, 0.05, 0.10] # candidate recall protocol (v1.1 7.2)
  scenario_bootstrap: true # image-level bootstrap 95% CI on standalone model.val()
  bootstrap_iters: 200

# YOLO11n backbone (pinned ultralytics 8.3.247, identical to official yolo11.yaml)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head with DSRDetect (P3, P4, P5)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, DSRDetect, [nc, dsr]] # DSRDetect(P3, P4, P5)
