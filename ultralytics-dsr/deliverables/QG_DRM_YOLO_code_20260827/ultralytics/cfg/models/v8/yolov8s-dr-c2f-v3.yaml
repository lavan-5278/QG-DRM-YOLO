# YOLOv8s + DR-C2f v3 Backbone-only controlled ablation.
# DRC2fV3 replaces the same four Backbone C2f locations as the YOLOv8n v3 run; Neck/Detect remain baseline.
nc: 80
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, DRC2fV3, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, DRC2fV3, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, DRC2fV3, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, DRC2fV3, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  - [[15, 18, 21], 1, Detect, [nc]]
