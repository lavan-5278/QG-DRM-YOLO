# YOLOv8s + DR-C2f v3 complete C2f replacement ablation.
# All eight C2f blocks are replaced: four Backbone blocks and four Neck blocks; Detect is unchanged.
nc: 80
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, DRC2fV3, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, DRC2fV3, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, DRC2fV3, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, DRC2fV3, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, DRC2fV3, [512]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, DRC2fV3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, DRC2fV3, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, DRC2fV3, [1024]]
  - [[15, 18, 21], 1, Detect, [nc]]
