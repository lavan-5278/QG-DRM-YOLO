# YOLOv8s: QG-AFPN + C4-only reliability-gated DR-C2f v3 + MLKCM.
# MLKCM refines all three QG-AFPN outputs immediately before Detect.
nc: 3
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, RGDRC2fV3, [512, true]]       # C4 only; starts as native C2f
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]             # C5 remains native C2f
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C2f, [1024]]
  - [[15, 18, 21], 1, QGAFPN, []]
  - [-1, 1, Index, [128, 0]]
  - [22, 1, Index, [256, 1]]
  - [22, 1, Index, [512, 2]]
  - [23, 1, MLKCM, [128]]                  # P3 Detect-input refinement
  - [24, 1, MLKCM, [256]]                  # P4 Detect-input refinement
  - [25, 1, MLKCM, [512]]                  # P5 Detect-input refinement
  - [[26, 27, 28], 1, Detect, [3]]
