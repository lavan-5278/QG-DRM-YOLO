# Tiny smoke matrix for the experiment runner (used by tests + quick checks).
# 1 epoch per experiment on the 6-image smoke dataset, CPU, single seed.
global:
  runs_root: runs/matrix_smoke
  data: tests/data/smoke.yaml
  imgsz: 128
  batch: 2
  device: cpu
  workers: 0
  seeds: [0]

experiments:
  - name: smoke_baseline
    cfg: ultralytics/cfg/experiments/scb_yolo11n_baseline.yaml
    model: ultralytics/cfg/models/11/yolo11.yaml
    train: {epochs: 1, plots: false}

  - name: smoke_dsr
    cfg: ultralytics/cfg/experiments/scb_dsr_full.yaml
    model: ultralytics/cfg/models/11/yolo11n-dsr.yaml
    trainer: dsr
    train: {epochs: 1, plots: false}
    dsr: {candidate_conf: 0.0001, pre_topk: 100, relation_topk: 40}
