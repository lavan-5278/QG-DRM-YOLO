# YOLO11n + CompositionDetect (Composition-Aware Auxiliary Learning, CAAL)
# Base: YOLO11 (P3/8 - P5/32), Detect head replaced by CompositionDetect which adds
# a training-only auxiliary branch predicting the image-level behaviour composition.

# Parameters
nc: 3 # SCB-Dataset3-S: hand_raising, reading, writing
scales: # model compound scaling constants [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]

comp:
  enabled: true # training-only auxiliary; false => byte-identical to official Detect
  hidden: 256 # CompositionHead hidden width
  embed_dim: 64 # composition embedding width
  inject: true # add per-image composition bias to classification logits (train + infer)
  lambda_comp: 0.5 # weight of the image-level composition BCE loss

# YOLO11n backbone (identical to official yolo11.yaml)
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head with CompositionDetect (P3, P4, P5)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  - [[16, 19, 22], 1, CompositionDetect, [nc, comp]] # CompositionDetect(P3, P4, P5)
