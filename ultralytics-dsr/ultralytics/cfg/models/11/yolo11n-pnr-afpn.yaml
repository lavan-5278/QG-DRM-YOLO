# Matched YOLO11n + PNR-DFL + standard three-scale AFPN Neck.
# AFPN replaces only the final P3/P4/P5 feature hand-off; Detect and PNR remain unchanged.

nc: 3
scales:
  n: [0.50, 0.25, 1024]

pnr:
  alpha: 1.0
  lambda_pnr: 0.25
  scale_floor: 1.0
  normalize: true
  weight_mode: joint

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[16, 19, 22], 1, AFPN, []]
  - [-1, 1, Index, [64, 0]]
  - [23, 1, Index, [128, 1]]
  - [23, 1, Index, [256, 2]]
  - [[24, 25, 26], 1, Detect, [nc]]
