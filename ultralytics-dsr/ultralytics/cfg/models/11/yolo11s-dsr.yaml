# DSR-Det scale 's' variant (file name selects scale 's').
# Identical structure to yolo11n-dsr.yaml; see that file for comments.

nc: 3
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]

dsr:
  enabled: true
  relation_dim: 128
  roi_size: 3
  pre_topk: 300
  relation_topk: 100
  candidate_conf: 0.03
  candidate_iou: 0.70
  min_candidates: 2
  global_topk: 30
  neighbor_k: 5
  use_composition: true # v3: composition prior (conf-weighted group prototype + soft class histogram), selected candidates only
  composition_proto: conf # conf | uniform
  region_grid: [2, 2]
  uncertainty_type: max_prob
  gate_mode: uncertainty
  track_uncertainty: true
  relation_type: signed_diff
  relation_variant: none
  include_geometry: true
  candidate_source: current
  ema_decay: 0.999
  track_stability: true
  stability_ref_epoch: 0
  stability_every: 5
  stability_probe_batches: 1
  stage_b1_epochs: 20
  stage_b1_freeze: [backbone, neck, base_detect]
  stage_b2_freeze: [backbone, neck, base_detect] # v3: base detector frozen for the whole Stage B
  stage_b2_lr_scale: 0.1
  gicr_warmup_epochs: 5
  lambda_ref_cls: 1.0
  lambda_ref_box: 2.0
  lambda_gicr: 0.05
  lambda_gicr_diff: 0.5
  use_global: true
  use_region: true
  use_neighbor: true
  use_uncertainty_gate: true
  use_gicr: true
  validator: false
  oracle: true
  scenario_conf_sweep: [0.01, 0.03, 0.05, 0.10]
  scenario_bootstrap: true
  bootstrap_iters: 200

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]
  - [[16, 19, 22], 1, DSRDetect, [nc, dsr]]
