# 6-class SCB-Dataset3-U transfer of the established 5k_HRW single-model best topology.
# Structure is unchanged: QG-AFPN + C4 RGDRC2fV3 + MLKCM(P3/P4/P5) + P3DetailRestore.
nc: 6
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, RGDRC2fV3, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C2f, [1024]]
  - [[15, 18, 21], 1, QGAFPN, []]
  - [-1, 1, Index, [128, 0]]
  - [22, 1, Index, [256, 1]]
  - [22, 1, Index, [512, 2]]
  - [23, 1, MLKCM, [128]]
  - [24, 1, MLKCM, [256]]
  - [25, 1, MLKCM, [512]]
  - [26, 1, P3DetailRestore, [128]]
  - [[29, 27, 28], 1, Detect, [nc]]
