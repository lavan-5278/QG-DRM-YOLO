# YOLOv8s: QG-AFPN + stage-selective DR-C2f v3.
# P2/P3 retain the native C2f local-detail path; only deep C4/C5 use DRC2fV3.
nc: 3
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]             # P2: native local-detail C2f
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]             # P3: native local-detail C2f
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, DRC2fV3, [512, true]]         # C4: deep semantic relay
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, DRC2fV3, [1024, true]]        # C5: deep semantic relay
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C2f, [1024]]
  - [[15, 18, 21], 1, QGAFPN, []]
  - [-1, 1, Index, [128, 0]]
  - [22, 1, Index, [256, 1]]
  - [22, 1, Index, [512, 2]]
  - [[23, 24, 25], 1, Detect, [3]]
